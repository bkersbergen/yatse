name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Check release version
        shell: pwsh
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata' }
          $version = ($metadata.packages | Where-Object name -eq 'yatse').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match Cargo.toml version: v$version"
          }

      - name: Run tests
        run: cargo +stable test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, target/package -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/yatse.exe dist/yatse.exe
          Copy-Item dist/yatse.exe target/package/yatse.exe
          Copy-Item readme.md target/package/README.md
          New-Item -ItemType Directory -Path target/package/assets -Force | Out-Null
          Copy-Item assets/yatse_screenshot.png target/package/assets/
          Compress-Archive -Path target/package/* -DestinationPath dist/yatse-windows-x64.zip
          $checksums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v6
        with:
          name: yatse-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: yatse-windows-x64
          path: dist

      - name: Publish release with Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--generate-notes',
            '--title', "YATSE $env:RELEASE_TAG"
          )
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @('dist/yatse.exe', 'dist/yatse-windows-x64.zip', 'dist/SHA256SUMS.txt')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }
